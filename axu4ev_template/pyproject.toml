[project]
name = "axu4ev-config"
version = "0.3.0"
description = "Portable Kconfig editor for the AXU4EV-F Vivado template"
requires-python = ">=3.10"
dependencies = [
    "textual>=6,<7",
]

[project.scripts]
axu4ev-config = "axu4ev_config.cli:entrypoint"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["axu4ev_config", "axu4ev_config.locales"]

[tool.setuptools.package-data]
"axu4ev_config.locales" = ["*.json"]

[tool.uv]
package = true
